<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <title>Calculator</title>
  </head>
  <script src="practice.js" defer></script>
  <body>
    <div class="container">
      <input type="text" class="text" id="demo" readonly />
      <div class="buttons">
        <button class="btn" value="AC" onclick="clearDisplay('AC')">AC</button>
        <button class="btn" value="backspace" onclick="removeChar()">
          &#9003;
        </button>
        <button class="btn" value="%" onclick="show('%')">%</button>
        <button class="btns" value="/" onclick="show('/')">/</button>

        <button class="btn" value="7" onclick="show('7')">7</button>
        <button class="btn" value="8" onclick="show('8')">8</button>
        <button class="btn" value="9" onclick="show('9')">9</button>
        <button class="btns" value="*" onclick="show('*')">*</button>

        <button class="btn" value="4" onclick="show('4')">4</button>
        <button class="btn" value="5" onclick="show('5')">5</button>
        <button class="btn" value="6" onclick="show('6')">6</button>
        <button class="btns" value="-" onclick="show('-')">-</button>

        <button class="btn" value="1" onclick="show('1')">1</button>
        <button class="btn" value="2" onclick="show('2')">2</button>
        <button class="btn" value="3" onclick="show('3')">3</button>
        <button class="btns" value="+" onclick="show('+')">+</button>

        <button class="btn" value="00" onclick="show('00')">00</button>
        <button class="btn" value="0" onclick="show('0')">0</button>
        <button class="btn" value="." onclick="show('.')">.</button>
        <button class="btns" value="=" onclick="calculate('=')">=</button>
      </div>
    </div>
  </body>
</html>
